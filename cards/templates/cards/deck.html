{% extends "cards/layout.html" %}
    {% block body %}
        <h1>{{ deck.name }}</h1>
        <ul style="list-style-type:none;">
            {% for card in cards %}
                <li>{{ card.front }}: {{ card.back }}</li>
            {% endfor %}
        </ul>
        <a href="{% url 'delete_deck' deck.id %}">
            Delete Deck
        </a>
    {% endblock %}
