{% extends 'cards/layout.html' %}

{% block body %}
    <h1>Delete {{ deck.name }}?</h1>
    <p>Are you sure you want to delete this deck?</p>
    <form method="post">
        {% csrf_token %}
        <div class="mt-2">
            <button class="btn btn-primary mr-2" type="submit">Delete</button>
            <a class="btn btn-secondary" href="{% url 'deck' deck.id %}">Cancel</a>
        </div>
    </form>
{% endblock %}
