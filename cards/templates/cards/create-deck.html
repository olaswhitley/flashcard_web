{% extends 'cards/layout.html' %}

{% block body %}
    <h2>Create Deck</h2>
    <form action="{% url 'create-deck' %}" method="post">
        {% csrf_token %}
        {{ deck_form.name }}
        <div class="mt-2">
            <button class="btn btn-primary mr-2" type="submit">Enter</button>
            <a class="btn btn-secondary" href="{% url 'index' %}">Cancel</a>
        </div>
    </form>
{% endblock %}
