{% extends 'cards/layout.html' %}

{% block body %}
    <h1>{{ deck.name }}</h1>
    <form action="{% url 'add_card' deck.id %}" method="post">
        {% csrf_token %}
        {{ card_form.front }}
        {{ card_form.back }}
        <div class="mt-2">
            <button class="btn btn-primary mr-2" type="submit">Add Card</button>
            <a class="btn btn-secondary" href="{% url 'deck' deck.id %}">Cancel</a>
        </div>
    </form>
{% endblock %}
